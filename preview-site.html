<script>
/* Private preview link: this browser sees the full site while maintenance mode is on.
   Add ?stop to the address to go back to seeing the maintenance page. */
(function () {
  try {
    if (/[?&]stop\b/.test(location.search)) { localStorage.removeItem('pw_owner'); location.replace('/'); return; }

  } catch (e) {}
  location.replace('/');
})();
</script>
